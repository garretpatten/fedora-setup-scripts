---
name: "Quality Checks"

on: [pull_request]

permissions:
  contents: read

jobs:
  quality-checks:
    name: "Linters"
    # quality-checks reusable workflow @ master (f0c4ccbc)
    # yamllint disable-line rule:line-length
    uses: garretpatten/quality-checks/.github/workflows/quality-checks.yaml@f0c4ccbc6c78649ac60b2d18ffb02c59b11c3e03
    with:
      markdownlint_run: true
      prettier_run: true
      shellcheck_run: true
      yamllint_run: true
    secrets: inherit
