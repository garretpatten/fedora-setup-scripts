# yamllint disable-file rule:line-length
---
name: "Test Runner"

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  unit-tests:
    name: "Unit tests (bats)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        # actions/checkout v7.0.1
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup bats
        id: setup-bats
        # bats-core/bats-action 4.1.0
        # yamllint disable-line rule:line-length
        uses: bats-core/bats-action@3566550e0f594451ac0f58fcbfdeca93aa29a45e
        with:
          bats-version: "1.14.0"
          detik-install: false
          github-token: ${{ github.token }}

      - name: ShellCheck tests
        # The shared quality gate only lints changed shell files, so
        # lint the whole suite here (*.bats, helpers, fixtures, stubs).
        run: |
          find tests -type f \( -name '*.bats' -o -name '*.bash' \
            -o -name '*.sh' -o -path 'tests/stubs/*' \) -print0 |
            xargs -0 shellcheck -x

      - name: Run bats
        env:
          BATS_LIB_PATH: ${{ steps.setup-bats.outputs.lib-path }}
          TERM: xterm
        run: bats --recursive tests/

  test-cli:
    name: "CLI-only install"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: fedora:latest

    steps:
      - name: Install prerequisites for CI
        run: |
          set -eo pipefail
          dnf -y upgrade --refresh
          dnf -y install \
            gcc make openssl shadow-utils systemd systemd-pam \
            git curl wget ca-certificates sudo gnupg2 procps-ng \
            findutils unzip which xz file pkgconf-pkg-config \
            dnf-plugins-core python3 python3-pip python3-devel

      - name: Checkout repository
        # actions/checkout v7.0.1
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive

      - name: Make scripts executable
        run: |
          find src/scripts -name '*.sh' -exec chmod +x {} +
          find scripts -name '*.sh' -exec chmod +x {} +

      - name: Run CLI-only install
        run: |
          cd src/scripts
          bash run-install.sh cli

      - name: Validate CLI installs
        run: ./scripts/validate-installs-cli.sh

  test-config:
    name: "Configuration run"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: fedora:latest

    steps:
      - name: Install prerequisites for CI
        run: |
          set -eo pipefail
          dnf -y upgrade --refresh
          dnf -y install \
            gcc make openssl shadow-utils systemd systemd-pam \
            git curl wget ca-certificates sudo gnupg2 procps-ng \
            findutils unzip which xz file pkgconf-pkg-config \
            dnf-plugins-core python3 python3-pip python3-devel

      - name: Checkout repository
        # actions/checkout v7.0.1
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive

      - name: Make scripts executable
        run: |
          find src/scripts -name '*.sh' -exec chmod +x {} +
          find scripts -name '*.sh' -exec chmod +x {} +

      - name: Run configuration
        run: |
          cd src/scripts
          bash run-config.sh

      - name: Validate config-only outcomes
        run: ./scripts/validate-config-only.sh

  test-full:
    name: "Full install"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: fedora:latest

    steps:
      - name: Install prerequisites for CI
        run: |
          set -eo pipefail
          dnf -y upgrade --refresh
          dnf -y install \
            gcc make openssl shadow-utils systemd systemd-pam \
            git curl wget ca-certificates sudo gnupg2 procps-ng \
            findutils unzip which xz file pkgconf-pkg-config \
            dnf-plugins-core python3 python3-pip python3-devel

      - name: Checkout repository
        # actions/checkout v7.0.1
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive

      - name: Make scripts executable
        run: |
          find src/scripts -name '*.sh' -exec chmod +x {} +
          find scripts -name '*.sh' -exec chmod +x {} +

      - name: Run full install
        run: |
          cd src/scripts
          bash run-install.sh all

      - name: Validate full installs
        run: ./scripts/validate-installs.sh

  test-master:
    name: "Master (install + config)"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: fedora:latest

    steps:
      - name: Install prerequisites for CI
        run: |
          set -eo pipefail
          dnf -y upgrade --refresh
          dnf -y install \
            gcc make openssl shadow-utils systemd systemd-pam \
            git curl wget ca-certificates sudo gnupg2 procps-ng \
            findutils unzip which xz file pkgconf-pkg-config \
            dnf-plugins-core python3 python3-pip python3-devel

      - name: Checkout repository
        # actions/checkout v7.0.1
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive

      - name: Make scripts executable
        run: |
          find src/scripts -name '*.sh' -exec chmod +x {} +
          find scripts -name '*.sh' -exec chmod +x {} +

      - name: Run setup scripts
        run: |
          cd src/scripts
          bash master.sh

      - name: Validate installs and config
        run: ./scripts/validate.sh
