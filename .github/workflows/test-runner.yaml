# yamllint disable-file rule:line-length
---
name: "Test Runner"

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test-cli:
    name: "CLI-only install"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: fedora:latest

    steps:
      - name: Install prerequisites for CI
        run: |
          set -eo pipefail
          dnf -y upgrade --refresh
          dnf -y install \
            gcc make openssl shadow-utils systemd systemd-pam \
            git curl wget ca-certificates sudo gnupg2 procps-ng \
            findutils unzip which xz file pkgconf-pkg-config \
            dnf-plugins-core python3 python3-pip python3-devel

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Make scripts executable
        run: |
          find src/scripts -name '*.sh' -exec chmod +x {} +
          find scripts -name '*.sh' -exec chmod +x {} +

      - name: Run CLI-only install
        run: |
          cd src/scripts
          bash run-install.sh cli

      - name: Validate CLI installs
        run: ./scripts/validate-installs-cli.sh

  test-config:
    name: "Configuration run"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: fedora:latest

    steps:
      - name: Install prerequisites for CI
        run: |
          set -eo pipefail
          dnf -y upgrade --refresh
          dnf -y install \
            gcc make openssl shadow-utils systemd systemd-pam \
            git curl wget ca-certificates sudo gnupg2 procps-ng \
            findutils unzip which xz file pkgconf-pkg-config \
            dnf-plugins-core python3 python3-pip python3-devel

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Make scripts executable
        run: |
          find src/scripts -name '*.sh' -exec chmod +x {} +
          find scripts -name '*.sh' -exec chmod +x {} +

      - name: Run configuration
        run: |
          cd src/scripts
          bash run-config.sh

      - name: Validate config-only outcomes
        run: ./scripts/validate-config-only.sh

  test-full:
    name: "Full install"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: fedora:latest

    steps:
      - name: Install prerequisites for CI
        run: |
          set -eo pipefail
          dnf -y upgrade --refresh
          dnf -y install \
            gcc make openssl shadow-utils systemd systemd-pam \
            git curl wget ca-certificates sudo gnupg2 procps-ng \
            findutils unzip which xz file pkgconf-pkg-config \
            dnf-plugins-core python3 python3-pip python3-devel

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Make scripts executable
        run: |
          find src/scripts -name '*.sh' -exec chmod +x {} +
          find scripts -name '*.sh' -exec chmod +x {} +

      - name: Run full install
        run: |
          cd src/scripts
          bash run-install.sh all

      - name: Validate full installs
        run: ./scripts/validate-installs.sh

  test-master:
    name: "Master (install + config)"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: fedora:latest

    steps:
      - name: Install prerequisites for CI
        run: |
          set -eo pipefail
          dnf -y upgrade --refresh
          dnf -y install \
            gcc make openssl shadow-utils systemd systemd-pam \
            git curl wget ca-certificates sudo gnupg2 procps-ng \
            findutils unzip which xz file pkgconf-pkg-config \
            dnf-plugins-core python3 python3-pip python3-devel

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Make scripts executable
        run: |
          find src/scripts -name '*.sh' -exec chmod +x {} +
          find scripts -name '*.sh' -exec chmod +x {} +

      - name: Run setup scripts
        run: |
          cd src/scripts
          bash master.sh

      - name: Validate installs and config
        run: ./scripts/validate.sh
